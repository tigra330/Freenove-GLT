[env:freenove_5inch]
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3-WROOM-1-N16R8: 16 MB QIO-Flash, 8 MB Octal-PSRAM
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
board_build.f_cpu = 240000000L

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800  ; stabiler am CH340 / schwachen USB-Ports

build_flags =
    -DBOARD_HAS_PSRAM
    ; USB-C geht ueber den CH340 auf UART0. GPIO19/20 (native USB) sind vom
    ; GT911-Touch belegt -> USB-CDC MUSS aus sein, sonst keine Serial-Ausgabe.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DLV_CONF_INCLUDE_SIMPLE
    -I include

lib_deps =
    moononournation/GFX Library for Arduino@1.6.5
    tamctec/TAMC_GT911@1.0.2
    lvgl/lvgl@9.5.0
    bblanchon/ArduinoJson@^7.4.2
    knolleary/PubSubClient@^2.8
